<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loom 织造所 · 本地 AI 出图工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231d1b19'/%3E%3Cstop offset='1' stop-color='%233a3430'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7' y='7' width='18' height='18' rx='3' fill='none' stroke='%23f6f3ee' stroke-width='2'/%3E%3Ccircle cx='13' cy='13' r='2' fill='%23c08a7d'/%3E%3Cpath d='M25 19l-5-5-9 9' fill='none' stroke='%23f6f3ee' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
      </div>
      <div class="brand-text">
        <b>织造所</b>
        <span>LOOM</span>
      </div>
    </div>

    <nav id="nav"></nav>

    <div class="side-foot">
      <div class="storage-line" id="storage-line">本地存储 · 计算中…</div>
      <div class="side-actions">
        <button class="ghost-btn" id="btn-theme" title="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
        <button class="ghost-btn" id="btn-settings" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div id="topbar-title">
        <h1 id="view-title">图库</h1>
        <p id="view-sub"></p>
      </div>
      <div id="topbar-actions"></div>
    </header>
    <div id="view" tabindex="-1"></div>
  </main>
</div>

<div id="lightbox" class="hidden" aria-hidden="true"></div>
<div id="modal" class="hidden" aria-hidden="true"></div>
<div id="dropzone-hint" class="hidden">
  <div class="dz-inner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <b>松手即入库</b>
    <span>支持 JPG / PNG / WebP / AVIF，自动读取 PNG 里的生成参数</span>
  </div>
</div>
<div id="toasts"></div>

<input type="file" id="file-input" hidden>

<script src="assets/db.js"></script>
<script src="assets/parse.js"></script>
<script src="assets/ai.js"></script>
<script src="reference/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/reference.js"></script>
<script src="assets/comfy.js"></script>
<script src="assets/canvas.js"></script>
<script src="assets/manage.js"></script>
<script>
  if (window.Vault) {
    Vault.boot().then(() => { if (window.REF) REF.preload(); });
  }
</script>
</body>
</html>
