name: Build desktop apps

# 手动触发，或打 v* 标签时自动构建。
# 产物在 Actions 页面的 Artifacts 里下载：macOS 的 dmg/zip、Windows 的 exe。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # 打 v* 标签时要把安装包发布到 GitHub Release（内置更新器从这里拉）

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
            artifact: Loom-macOS-arm64
            glob: |
              desktop/dist/*-arm64.dmg
              desktop/dist/*-arm64-mac.zip
            build_cmd: npm run stage
            eb_args: --mac --arm64
            python_asset: cpython-3.12.16+20261026-aarch64-apple-darwin-install_only.tar.gz
          - os: macos-13
            name: macOS (Intel)
            artifact: Loom-macOS-x64
            glob: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
            build_cmd: npm run stage
            eb_args: --mac --x64
            python_asset: cpython-3.12.16+20261026-x86_64-apple-darwin-install_only.tar.gz
          - os: windows-latest
            name: Windows
            artifact: Loom-Windows
            glob: |
              desktop/dist/*.exe
            build_cmd: npm run stage
            eb_args: --win --x64
            python_asset: cpython-3.12.16+20261026-x86_64-pc-windows-msvc-install_only.tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps
        working-directory: desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci --no-audit --no-fund

      # desktop/runtime 是 .gitignore 里的二进制，CI 检出后没有它。
      # 从 python-build-standalone 下载对应的 standalone 解释器，
      # 这样打出来的 dmg / exe 才能真正「双击即用」。
      - name: Fetch standalone Python
        shell: bash
        env:
          PY_ASSET: ${{ matrix.python_asset }}
        run: |
          set -e
          url="https://github.com/astral-sh/python-build-standalone/releases/download/20261026/${PY_ASSET}"
          mkdir -p desktop/runtime
          curl -fsSL --retry 5 --retry-delay 2 -o /tmp/python-standalone.tar.gz "$url"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mkdir -p desktop/runtime/python-win
            tar -xzf /tmp/python-standalone.tar.gz -C desktop/runtime/python-win --strip-components=1
            test -f desktop/runtime/python-win/python.exe
          else
            mkdir -p desktop/runtime/python
            tar -xzf /tmp/python-standalone.tar.gz -C desktop/runtime/python --strip-components=1
            test -x desktop/runtime/python/bin/python3
          fi

      # npm ci 的 electron postinstall 偶尔会静默失败（镜像超时），
      # 二进制缺失时 electron-builder 会自己再下一遍，CI 里更容易超时。
      # 这里显式确认一次，缺了就重跑 electron 的 install.js。
      - name: Ensure Electron binary
        shell: bash
        working-directory: desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          check_electron() {
            node -e "const fs=require('fs'); const p=require('electron'); if(!fs.existsSync(p)) process.exit(1)"
          }
          check_electron || node node_modules/electron/install.js
          check_electron

      - name: Debug electron install
        continue-on-error: true
        working-directory: desktop
        run: |
          echo "electron pkg version: $(node -e "console.log(require('electron/package.json').version)" 2>&1)"
          ls -la node_modules/electron/dist/ 2>&1 | head -8 || echo "electron dist 缺失"
          echo "electron path.txt: $(cat node_modules/electron/path.txt 2>&1)"

      # 没买代码签名证书，明确关掉自动发现，否则 electron-builder 会去找钥匙串报错。
      # 只打当前 runner 架构，别让一台机器去下两个平台的 electron。
      # electron 二进制从 GitHub 下载在 CI 里常超时，走 npmmirror 镜像更稳。
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          set +e
          ( npm run stage && npx electron-builder ${{ matrix.eb_args }} --publish never ) 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 12 build.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Build failed::$msg"
            {
              echo "### Build log tail"
              echo '```'
              tail -n 40 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
        shell: bash

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.artifact }}
          path: desktop/build.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 30

      # 内置更新器从 GitHub Releases 拉安装包，所以打 v* 标签时顺手发布
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true   # 0.x 阶段都是预发布版
          files: |
            desktop/dist/*.dmg
            desktop/dist/*-mac.zip
            desktop/dist/*.exe
          # 每个平台只产出自己那份：mac 没有 exe，Windows 没有 dmg。
          # 用 false 让三个矩阵 job 各自上传、共同补齐同一个 Release。
          fail_on_unmatched_files: false
