name: Build desktop apps

# 手动触发，或打 v* 标签时自动构建。
# 产物在 Actions 页面的 Artifacts 里下载：macOS 的 dmg/zip、Windows 的 exe。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
            artifact: Loom-macOS-arm64
            glob: |
              desktop/dist/*-arm64.dmg
              desktop/dist/*-arm64-mac.zip
            build_cmd: npm run stage && npx electron-builder --mac --arm64
          - os: macos-13
            name: macOS (Intel)
            artifact: Loom-macOS-x64
            glob: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
            build_cmd: npm run stage && npx electron-builder --mac --x64
          - os: windows-latest
            name: Windows
            artifact: Loom-Windows
            glob: |
              desktop/dist/*.exe
            build_cmd: npm run stage && npx electron-builder --win --x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps
        working-directory: desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci --no-audit --no-fund

      - name: Debug electron install
        working-directory: desktop
        run: |
          echo "electron pkg version: $(node -e "console.log(require('electron/package.json').version)" 2>&1)"
          ls -la node_modules/electron/dist/ 2>&1 | head -8 || echo "electron dist 缺失"
          echo "electron path.txt: $(cat node_modules/electron/path.txt 2>&1)"

      # 没买代码签名证书，明确关掉自动发现，否则 electron-builder 会去找钥匙串报错。
      # 只打当前 runner 架构，别让一台机器去下两个平台的 electron。
      # electron 二进制从 GitHub 下载在 CI 里常超时，走 npmmirror 镜像更稳。
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: ${{ matrix.build_cmd }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 30
