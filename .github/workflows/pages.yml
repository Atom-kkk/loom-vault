name: Deploy to GitHub Pages

# 纯静态发布：前端不依赖 serve.py，访问者打开就能看界面、拖图、编辑画布。
# 出图要连他们自己本机的 ComfyUI（见 README「在线体验」）。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，新的把旧的顶掉
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 参考库缩略图（约 68 MB / 4345 张）被 .gitignore 排除，仓库里没有。
      # 发布前现拉一遍，否则线上的服饰 / 人脸 / 姿势三个库全是破图。
      # 拉了失败也继续发：宁可库空着，也别整站发不出去。
      - name: Fetch reference thumbnails
        continue-on-error: true
        run: python3 scripts/fetch_reference_gcore.py

      - name: Report thumbnail count
        run: |
          for d in outfits faces poses; do
            printf '%-10s %s\n' "$d" "$(ls reference/$d 2>/dev/null | wc -l)"
          done

      # 只挑站点需要的东西，别把 .git / node_modules / 测试 / 文档一起打进去
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html favicon.ico apple-touch-icon.png apple-touch-icon-precomposed.png .nojekyll _site/
          cp -r assets demo reference _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true          # Pages 还没开就顺手开掉

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
